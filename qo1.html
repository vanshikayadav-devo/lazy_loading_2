
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lazy Loading Experiment</title>
    <link rel="stylesheet" href="style.css">
    <style>
    
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #f4f4f4;
    color: #333;
}

header {
    background-color: #222;
    color: white;
    text-align: center;
    padding: 25px;
}

main {
    width: 90%;
    max-width: 1100px;
    margin: 25px auto;
}

.banner {
    background: white;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
}

.banner img {
    width: 100%;
    height: 350px;
    object-fit: cover;
    border-radius: 8px;
}

.gallery-title {
    text-align: center;
    margin-top: 35px;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.gallery img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    border-radius: 10px;
    box-shadow: 0 3px 8px #ccc;
}

footer {
    background-color: #222;
    color: white;
    text-align: center;
    padding: 15px;
    margin-top: 30px;
}

@media (max-width: 700px) {
    .gallery {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 450px) {
    .gallery {
        grid-template-columns: 1fr;
    }

    .banner img {
        height: 220px;
    }
}
    </style>
</head>
<body>

    <header>
        <h1>Image Gallery</h1>
        <p>Experiment 6: Web Performance Optimization</p>
    </header>

    <main>
        <section class="banner">
            <h2>Explore the World</h2>
            <img
                src="https://picsum.photos/seed/banner/1200/450"
                alt="Main banner image">
        </section>

        <h2 class="gallery-title">Our Gallery</h2>

        <section class="gallery">
            <img src="https://picsum.photos/seed/nature/600/400"
                 alt="Nature image" loading="lazy">

            <img src="https://picsum.photos/seed/mountain/600/400"
                 alt="Mountain image" loading="lazy">

            <img src="https://picsum.photos/seed/forest/600/400"
                 alt="Forest image" loading="lazy">

            <img src="https://picsum.photos/seed/ocean/600/400"
                 alt="Ocean image" loading="lazy">

            <img src="https://picsum.photos/seed/city/600/400"
                 alt="City image" loading="lazy">

            <img src="https://picsum.photos/seed/flower/600/400"
                 alt="Flower image" loading="lazy">

            <img src="https://picsum.photos/seed/desert/600/400"
                 alt="Desert image" loading="lazy">

            <img src="https://picsum.photos/seed/wildlife/600/400"
                 alt="Wildlife image" loading="lazy">

            <img src="https://picsum.photos/seed/lake/600/400"
                 alt="Lake image" loading="lazy">
        </section>
    </main>

    <footer>
        <p>Web Performance Optimization Lab</p>
    </footer>

</body>
</html>
